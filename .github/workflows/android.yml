
name: Build MisCuentas 1.9.5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android necesarios
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "No se encuentra sdkmanager"
            exit 1
          fi

          "$SDKMANAGER" --licenses </dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer y localizar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MisCuentas_1.9.5.zip"

          if [ ! -f "$ZIP" ]; then
            echo "No se encuentra $ZIP en la raíz del repositorio"
            ls -la
            exit 1
          fi

          mkdir -p proyecto_extraido
          unzip -q "$ZIP" -d proyecto_extraido

          SETTINGS="$(find proyecto_extraido -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "No se encuentra settings.gradle dentro del ZIP"
            find proyecto_extraido -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "No se encuentra la configuración Gradle de la aplicación"
            exit 1
          fi

          echo "Proyecto localizado en: $PROJECT_DIR"

      - name: Validar versión 1.9.5
        shell: bash
        run: |
          set -e

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          echo "Comprobando configuración de versión..."

          grep -E 'versionName[[:space:]]*[= ]*["'\'']1\.9\.5["'\'']' "$GRADLE_FILE" || {
            echo "ERROR: versionName no es 1.9.5"
            exit 1
          }

          grep -E 'versionCode[[:space:]]*[= ]*31' "$GRADLE_FILE" || {
            echo "ERROR: versionCode no es 31"
            exit 1
          }

      - name: Validar JavaScript
        shell: bash
        run: |
          set -e
          find "$PROJECT_DIR" -type f -name "*.js" -not -path "*/node_modules/*" -print0 |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Compilar APK 1.9.5
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug

      - name: Preparar APK con nombre de versión
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No se ha generado ningún APK"
            exit 1
          fi

          mkdir -p salida
          cp "$APK" "salida/MisCuentas-1.9.5-v31.apk"

          ls -lh salida/

      - name: Publicar APK con nombre de versión
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.9.5-v31
          path: salida/MisCuentas-1.9.5-v31.apk
          if-no-files-found: error
          retention-days: 30
          
