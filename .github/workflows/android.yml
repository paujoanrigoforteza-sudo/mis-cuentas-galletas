
name: Build MisCuentas 1.9.25

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar componentes Android
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar proyecto
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/MisCuentas_1.9.25.zip"
          if [ -f "$GITHUB_WORKSPACE/app/build.gradle" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            test -s "$ZIP_FILE" || { echo "::error::No encuentro MisCuentas_1.9.25.zip en la raíz"; exit 1; }
            mkdir -p "$RUNNER_TEMP/miscuentas-src"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/miscuentas-src"
            mapfile -t FILES < <(find "$RUNNER_TEMP/miscuentas-src" -type f -path '*/app/build.gradle' -print)
            [ "${#FILES[@]}" -eq 1 ] || { echo "::error::El ZIP debe contener exactamente un app/build.gradle"; exit 1; }
            PROJECT="${FILES[0]%/app/build.gradle}"
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Validar versión, widget y GIF animado
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -Eq 'versionCode[[:space:]]+51([[:space:]]|$)' app/build.gradle
          grep -Fq 'versionName "1.9.25"' app/build.gradle
          grep -Fq 'MisCuentas 1.9.25' app/src/main/AndroidManifest.xml
          grep -Fq 'android:layout_width="88dp" android:layout_height="88dp"' app/src/main/res/layout/debt_widget.xml
          grep -Fq 'VoicePopupActivity.class' app/src/main/java/com/pau/miscuentas/DebtWidgetProvider.java
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          assets = Path('app/src/main/assets')
          im = Image.open(assets / 'chick_header_walk.gif')
          if im.format != 'GIF' or im.size != (543,181) or im.n_frames != 16:
              raise SystemExit('El GIF de cabecera no tiene las dimensiones/fotogramas esperados')
          html = (assets / 'index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No se encontraron scripts')
          Path('/tmp/miscuentas.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/miscuentas.js

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Preparar APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/MisCuentas-1.9.25-v51.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.9.25-v51
          path: MisCuentas-1.9.25-v51.apk
          if-no-files-found: error
