name: Build MisCuentas 1.3.3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate and verify project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "app/build.gradle" ]]; then
            PROJECT_DIR="."
          elif [[ -f "miscuentas_work/app/build.gradle" ]]; then
            PROJECT_DIR="miscuentas_work"
          else
            echo "::error::No encuentro app/build.gradle. Sube el CONTENIDO del ZIP a la raíz del repositorio, o deja la carpeta miscuentas_work."
            echo "Archivos y carpetas en la raíz:"
            ls -la
            exit 1
          fi

          echo "Proyecto localizado en: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html" || { echo "::error::Falta index.html"; exit 1; }
          grep -Fq "versionName '1.3.3'" "$PROJECT_DIR/app/build.gradle" || { echo "::error::versionName no es 1.3.3"; grep -n 'versionName\|versionCode' "$PROJECT_DIR/app/build.gradle"; exit 1; }
          grep -Fq "versionCode 18" "$PROJECT_DIR/app/build.gradle" || { echo "::error::versionCode no es 18"; grep -n 'versionName\|versionCode' "$PROJECT_DIR/app/build.gradle"; exit 1; }
          grep -Fq 'android:label="MisCuentas 1.3.3"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || { echo "::error::Etiqueta Android no coincide"; grep -n 'android:label' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto MisCuentas 1.3.3 verificado correctamente."

      - name: Build clean APK
        run: gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug

      - name: Rename and verify APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          DEST="MisCuentas-1.3.3.apk"
          test -s "$SOURCE" || { echo "::error::No se ha generado el APK en $SOURCE"; exit 1; }
          cp "$SOURCE" "$DEST"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEST" | grep -F "versionName='1.3.3'"
          ls -lh "$DEST"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.3.3-APK
          path: MisCuentas-1.3.3.apk
          if-no-files-found: error
