name: Build MisCuentas 1.9.11

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar componentes Android necesarios
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer y localizar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "app/build.gradle" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f -name 'MisCuentas_1.9.11_con_sonido.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No encuentro MisCuentas_1.9.11_con_sonido.zip en el repositorio."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/miscuentas-src"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/miscuentas-src"
            PROJECT="$(find "$RUNNER_TEMP/miscuentas-src" -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"

            if [ -z "$PROJECT" ]; then
              echo "::error::El ZIP no contiene un proyecto Android válido (app/build.gradle)."
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyecto localizado en: $PROJECT"

      - name: Validar versión y JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Eq 'versionCode[[:space:]]+37([[:space:]]|$)' app/build.gradle || {
            echo "::error::versionCode no es 37 en app/build.gradle"
            exit 1
          }
          grep -Eq 'versionName[[:space:]]+"1\\.9\\.11"' app/build.gradle || {
            echo "::error::versionName no es 1.9.11 en app/build.gradle"
            exit 1
          }

          python3 - <<'PY'
          import re
          path = 'app/src/main/assets/index.html'
          with open(path, encoding='utf-8') as f:
              html = f.read()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No se encontraron scripts JavaScript en index.html')
          with open('/tmp/miscuentas-1.9.11.js', 'w', encoding='utf-8') as f:
              f.write('\\n'.join(scripts))
          PY

          node --check /tmp/miscuentas-1.9.11.js

          test -f app/src/main/assets/sounds/reclamar_carga.mp3 || {
            echo "::error::Falta el sonido local reclamar_carga.mp3"
            exit 1
          }

      - name: Compilar APK 1.9.11
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Preparar APK con nombre de versión
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/MisCuentas-1.9.11-v37.apk"

      - name: Publicar APK con nombre de versión
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.9.11-v37
          path: MisCuentas-1.9.11-v37.apk
          if-no-files-found: error
          
