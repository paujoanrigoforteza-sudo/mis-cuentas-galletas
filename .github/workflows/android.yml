
name: Build MisCuentas 1.9.16

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar componentes Android necesarios
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer y localizar proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/MisCuentas_1.9.16.zip"
          if [ -f "$GITHUB_WORKSPACE/app/build.gradle" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            test -s "$ZIP_FILE" || {
              echo "::error::No encuentro MisCuentas_1.9.16.zip"
              exit 1
            }
            mkdir -p "$RUNNER_TEMP/miscuentas-src"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/miscuentas-src"
            mapfile -t PROJECT_FILES < <(
              find "$RUNNER_TEMP/miscuentas-src" \
                -type f -path '*/app/build.gradle' -print
            )
            if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
              echo "::error::El ZIP debe contener exactamente un app/build.gradle"
              exit 1
            fi
            PROJECT="${PROJECT_FILES[0]%/app/build.gradle}"
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Validar versión, JavaScript, GIFs y sonidos
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Eq 'versionCode[[:space:]]+42([[:space:]]|$)' app/build.gradle
          grep -Eq 'versionName[[:space:]]+["\x27]1\.9\.16["\x27]' app/build.gradle

          python3 - <<'PY'
          import re
          from PIL import Image

          p='app/src/main/assets/index.html'
          html=open(p,encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)

          if not scripts:
              raise SystemExit('No se encontraron scripts JavaScript')

          open('/tmp/miscuentas-1.9.16.js','w',encoding='utf-8').write('\n'.join(scripts))

          for name in [
              'chick_header_walk.gif',
              'mascot_sale_notebook.gif',
              'mascot_payment_backpack.gif'
          ]:
              im=Image.open('app/src/main/assets/'+name)
              if getattr(im,'n_frames',1)<12:
                  raise SystemExit(name+' necesita al menos 12 fotogramas')
              im.seek(0)
              if im.convert('RGBA').getchannel('A').getextrema()[0] != 0:
                  raise SystemExit(name+' no conserva transparencia real')
          PY

          node --check /tmp/miscuentas-1.9.16.js

          test -s app/src/main/assets/sounds/pencil-writing-02.mp3
          test -s app/src/main/assets/sounds/office-cash-register-12.mp3

      - name: Compilar APK 1.9.16
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Preparar APK con nombre de versión
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/MisCuentas-1.9.16-v42.apk"

      - name: Publicar APK con nombre de versión
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.9.16-v42
          path: MisCuentas-1.9.16-v42.apk
          if-no-files-found: error
          
