name: Build MisCuentas 1.3.3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate or extract MisCuentas 1.3.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/miscuentas_project"

          # First accept an already-extracted project, at root or one folder deep.
          PROJECT=""
          if [[ -f "app/build.gradle" ]]; then
            PROJECT="."
          elif [[ -f "miscuentas_work/app/build.gradle" ]]; then
            PROJECT="miscuentas_work"
          fi

          # Otherwise scan ZIP files and select the one containing version 1.3.3.
          if [[ -z "$PROJECT" ]]; then
            FOUND=""
            while IFS= read -r -d '' archive; do
              echo "Revisando archivo: $archive"
              if unzip -Z1 "$archive" | grep -Eq '(^|/)app/build\.gradle$'; then
                rm -rf "$RUNNER_TEMP/miscuentas_project"/*
                unzip -q "$archive" -d "$RUNNER_TEMP/miscuentas_project"
                candidate="$(find "$RUNNER_TEMP/miscuentas_project" -type f -path '*/app/build.gradle' -print -quit || true)"
                if [[ -n "$candidate" ]] && grep -Fq "versionName '1.3.3'" "$candidate"; then
                  FOUND="$(dirname "$(dirname "$candidate")")"
                  echo "ZIP válido encontrado: $archive"
                  break
                fi
              fi
            done < <(find . -maxdepth 3 -type f -iname '*.zip' -print0)

            if [[ -z "$FOUND" ]]; then
              echo "::error::No he encontrado ningún ZIP que contenga el proyecto MisCuentas versión 1.3.3."
              echo "Sube MisCuentas-1.3.3-proyecto-corregido.zip al repositorio y vuelve a ejecutar."
              echo "ZIP disponibles:"
              find . -maxdepth 3 -type f -iname '*.zip' -print || true
              exit 1
            fi
            PROJECT="$FOUND"
          fi

          test -f "$PROJECT/app/src/main/assets/index.html" || { echo "::error::Falta app/src/main/assets/index.html"; exit 1; }
          grep -Fq "versionName '1.3.3'" "$PROJECT/app/build.gradle" || { echo "::error::El proyecto localizado no es versión 1.3.3"; exit 1; }
          grep -Fq "versionCode 18" "$PROJECT/app/build.gradle" || { echo "::error::El versionCode no es 18"; exit 1; }
          grep -Fq 'android:label="MisCuentas 1.3.3"' "$PROJECT/app/src/main/AndroidManifest.xml" || { echo "::error::La etiqueta Android no coincide"; exit 1; }

          PROJECT="$(realpath "$PROJECT")"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyecto verificado: $PROJECT"

      - name: Build clean APK
        run: gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug

      - name: Rename and verify APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          DEST="MisCuentas-1.3.3.apk"
          test -s "$SOURCE" || { echo "::error::No se ha generado el APK"; exit 1; }
          cp "$SOURCE" "$DEST"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEST" | grep -F "versionName='1.3.3'"
          ls -lh "$DEST"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.3.3-APK
          path: MisCuentas-1.3.3.apk
          if-no-files-found: error
