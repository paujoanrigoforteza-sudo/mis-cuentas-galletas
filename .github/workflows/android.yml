
name: Build MisCuentas automático

on:
  push:
    paths:
      - 'MisCuentas_*.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Preparar proyecto
        shell: bash
        run: |
          set -e
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -name 'MisCuentas_*.zip' -type f | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then
            echo "No se ha encontrado ningún ZIP MisCuentas."
            exit 1
          fi
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d source
          GRADLE=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLE" ]; then
            echo "No se ha encontrado gradlew."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLE"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-APK-${{ github.run_number }}
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
