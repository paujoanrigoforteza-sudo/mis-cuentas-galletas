name: Build MisCuentas 1.9.6

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Instalar componentes Android necesarios
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer y localizar proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'MisCuentas_1.9.6.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
            fi
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No encuentro el proyecto Android ni un ZIP del proyecto."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/miscuentas-src"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/miscuentas-src"
            PROJECT="$(find "$RUNNER_TEMP/miscuentas-src" -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
            if [ -z "$PROJECT" ]; then
              echo "::error::El ZIP no contiene app/build.gradle."
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          fi

      - name: Validar versión y JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -Eq "versionCode[[:space:]]+32" app/build.gradle
          grep -Eq "versionName[[:space:]]+['\"]1\.9\.6['\"]" app/build.gradle
          python3 - <<'PY'
          import re
          p='app/src/main/assets/index.html'
          html=open(p,encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          open('/tmp/miscuentas-1.9.6.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/miscuentas-1.9.6.js

      - name: Compilar APK 1.9.6
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Preparar APK con nombre de versión
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/MisCuentas-1.9.6-v32.apk"

      - name: Publicar APK con nombre de versión
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.9.6-v32
          path: MisCuentas-1.9.6-v32.apk
          if-no-files-found: error
          
