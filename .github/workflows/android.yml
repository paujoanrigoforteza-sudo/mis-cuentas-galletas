name: Build MisCuentas 1.3.3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project version
        run: |
          set -euo pipefail
          test -f app/src/main/assets/index.html
          grep -q "versionName '1.3.3'" app/build.gradle
          grep -q 'versionCode 18' app/build.gradle
          grep -q 'android:label="MisCuentas 1.3.3"' app/src/main/AndroidManifest.xml
          echo "Proyecto MisCuentas 1.3.3 verificado."

      - name: Build clean APK
        run: gradle --no-daemon clean assembleDebug

      - name: Rename and verify APK
        run: |
          set -euo pipefail
          SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          DEST="MisCuentas-1.3.3.apk"
          test -s "$SOURCE"
          cp "$SOURCE" "$DEST"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEST" | grep "versionName='1.3.3'"
          ls -lh "$DEST"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.3.3-APK
          path: MisCuentas-1.3.3.apk
          if-no-files-found: error
