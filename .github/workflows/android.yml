name: Build MisCuentas 1.3.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and extract MisCuentas 1.3.2 project
        run: |
          set -euo pipefail
          test -f MisCuentas-1.3.2-proyecto.zip
          unzip -t MisCuentas-1.3.2-proyecto.zip
          unzip -q MisCuentas-1.3.2-proyecto.zip -d .
          test -f miscuentas_work/app/build.gradle
          grep -q "versionName '1.3.2'" miscuentas_work/app/build.gradle
          test -f miscuentas_work/app/src/main/assets/index.html
          echo 'Proyecto 1.3.2 verificado.'

      - name: Build clean debug APK
        working-directory: miscuentas_work
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK='miscuentas_work/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.3.2-APK
          path: miscuentas_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
