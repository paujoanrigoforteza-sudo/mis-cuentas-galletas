
name: Build MisCuentas 1.8.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK requerido
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        run: |
          curl --fail --location --retry 8 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          ZIP="MisCuentas_1.8.1_asistente_corregido.zip"
          test -s "$ZIP"
          mkdir -p "$RUNNER_TEMP/proyecto"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/proyecto"
          SETTINGS="$(find "$RUNNER_TEMP/proyecto" -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find "$RUNNER_TEMP/proyecto" -name settings.gradle.kts -print -quit)"
          fi
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validar JavaScript del proyecto
        run: |
          python3 - <<'PY'
          import pathlib, re, os
          p = pathlib.Path(os.environ["PROJECT_DIR"]) / "app/src/main/assets/index.html"
          s = p.read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", s, re.S | re.I)
          if not scripts:
              raise SystemExit("No se encontraron scripts JavaScript")
          pathlib.Path("/tmp/miscuentas-check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/miscuentas-check.js

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.8.1-pruebas
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
