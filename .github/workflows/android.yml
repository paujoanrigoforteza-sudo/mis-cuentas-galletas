
name: Build MisCuentas 1.9

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK requerido
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        run: |
          curl --fail --location --retry 8 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Preparar proyecto 1.9
        shell: bash
        run: |
          set -e

          ZIP="MisCuentas_1.9.zip"

          if [ -f "$ZIP" ]; then
            mkdir -p "$RUNNER_TEMP/proyecto"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/proyecto"
            SEARCH_DIR="$RUNNER_TEMP/proyecto"
          else
            SEARCH_DIR="$GITHUB_WORKSPACE"
          fi

          SETTINGS=$(find "$SEARCH_DIR" \
            -name settings.gradle \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$SEARCH_DIR" \
              -name settings.gradle.kts \
              -not -path '*/.gradle/*' \
              -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encuentra settings.gradle"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: No se encuentra app/build.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado: $PROJECT_DIR"

      - name: Verificar versión 1.9
        shell: bash
        run: |
          set -e
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          grep -Fq "versionName '1.9'" "$GRADLE_FILE"
          grep -Fq "versionCode 26" "$GRADLE_FILE"

          echo "Versión comprobada: 1.9"
          echo "Código de versión: 26"

      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          html = project / "app/src/main/assets/index.html"

          if not html.exists():
              raise SystemExit("ERROR: No se encuentra index.html")

          content = html.read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script[^>]*>(.*?)</script>",
              content,
              re.S | re.I
          )

          if not scripts:
              raise SystemExit("ERROR: No se encontraron scripts")

          Path("/tmp/miscuentas.js").write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )
          PY

          node --check /tmp/miscuentas.js

      - name: Compilar APK 1.9
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" clean assembleDebug

      - name: Preparar APK con nombre de versión
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$RUNNER_TEMP/apk/MisCuentas-1.9-v26.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.9-v26
          path: ${{ runner.temp }}/apk/MisCuentas-1.9-v26.apk
          if-no-files-found: error
          
