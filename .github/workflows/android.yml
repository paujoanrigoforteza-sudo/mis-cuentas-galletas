name: Build MisCuentas 1.7.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Gradle 8.9 with retries
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/gradle-8.9-bin.zip"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 600 \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            --output "$DIST"
          unzip -q "$DIST" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Extract and verify exact project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="MisCuentas_1.7.0_proyecto_descarga.zip"
          test -s "$ZIP" || { echo "::error::No encuentro $ZIP en la raíz del repositorio"; exit 1; }
          EXTRACT="$RUNNER_TEMP/miscuentas_1_7_0"
          mkdir -p "$EXTRACT"
          unzip -q "$ZIP" -d "$EXTRACT"
          CANDIDATE="$(find "$EXTRACT" -type f -path '*/app/build.gradle' -print -quit)"
          test -n "$CANDIDATE" || { echo "::error::El ZIP no contiene app/build.gradle"; exit 1; }
          PROJECT_DIR="$(dirname "$(dirname "$CANDIDATE")")"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/java/com/pau/miscuentas/MainActivity.java"
          grep -Fq "versionName '1.7.0'" "$PROJECT_DIR/app/build.gradle"
          grep -Fq "versionCode 22" "$PROJECT_DIR/app/build.gradle"
          grep -Fq 'android:label="MisCuentas 1.7.0"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto localizado: $PROJECT_DIR"

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/miscuentas.js" <<'PY'
          import re, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              html = f.read()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit("No se encontró JavaScript en index.html")
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              f.write("\n".join(scripts))
          PY
          node --check "$RUNNER_TEMP/miscuentas.js"

      - name: Build clean APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" clean assembleDebug

      - name: Rename and verify APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          DEST="MisCuentas-1.7.0.apk"
          test -s "$SOURCE" || { echo "::error::No se ha generado el APK"; exit 1; }
          cp "$SOURCE" "$DEST"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEST" | grep -F "versionName='1.7.0'"
          ls -lh "$DEST"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.7.0-APK
          path: MisCuentas-1.7.0.apk
          if-no-files-found: error
