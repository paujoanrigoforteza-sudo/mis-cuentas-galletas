name: Build MisCuentas 1.9.14

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar componentes Android necesarios
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer y localizar proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/app/build.gradle" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$GITHUB_WORKSPACE/MisCuentas_1.9.14.zip"
            if [ ! -f "$ZIP_FILE" ]; then
              echo "::error::No encuentro MisCuentas_1.9.14.zip en la raíz del repositorio."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/miscuentas-src"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/miscuentas-src"
            mapfile -t PROJECT_FILES < <(find "$RUNNER_TEMP/miscuentas-src" -type f -path '*/app/build.gradle' -print)
            if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
              echo "::error::El ZIP debe contener exactamente un app/build.gradle; encontrados: ${#PROJECT_FILES[@]}"
              exit 1
            fi
            PROJECT="${PROJECT_FILES[0]%/app/build.gradle}"
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyecto localizado en: $PROJECT"

      - name: Validar versión, JavaScript y animación
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -Eq 'versionCode[[:space:]]+40([[:space:]]|$)' app/build.gradle || { echo "::error::versionCode no es 40"; exit 1; }
          grep -Eq 'versionName[[:space:]]+"1\.9\.14"' app/build.gradle || { echo "::error::versionName no es 1.9.14"; exit 1; }
          python3 - <<'PY'
          import re
          p='app/src/main/assets/index.html'
          html=open(p,encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          if not scripts: raise SystemExit('No se encontraron scripts JavaScript')
          open('/tmp/miscuentas-1.9.14.js','w',encoding='utf-8').write('\n'.join(scripts))
          from PIL import Image
          im=Image.open('app/src/main/assets/chick_header_walk.gif')
          if im.n_frames < 12: raise SystemExit('La animación superior necesita al menos 12 fotogramas')
          im.seek(0)
          if im.convert('RGBA').getchannel('A').getextrema()[0] != 0: raise SystemExit('El GIF superior no tiene transparencia real')
          PY
          node --check /tmp/miscuentas-1.9.14.js
          test -f app/src/main/assets/sounds/reclamar_carga.mp3 || { echo "::error::Falta el sonido local reclamar_carga.mp3"; exit 1; }

      - name: Compilar APK 1.9.14
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Preparar APK con nombre de versión
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/MisCuentas-1.9.14-v40.apk"

      - name: Publicar APK con nombre de versión
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.9.14-v40
          path: MisCuentas-1.9.14-v40.apk
          if-no-files-found: error
          
