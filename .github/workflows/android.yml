
name: Crear APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar paquetes Android
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto actualizado
        run: |
          unzip -q miscuentas-v1.1.0-proyecto.zip -d .
          test -f miscuentas_work/app/build.gradle
          test -f miscuentas_work/settings.gradle

      - name: Compilar APK
        working-directory: miscuentas_work
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.1.0-debug
          path: miscuentas_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
