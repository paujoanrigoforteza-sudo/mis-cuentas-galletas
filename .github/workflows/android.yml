name: Build MisCuentas 1.9.5

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar proyecto Android
        shell: bash
        run: |
          if [ -f app/build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f miscuentas_v160/app/build.gradle ]; then
            echo "PROJECT_DIR=miscuentas_v160" >> "$GITHUB_ENV"
          else
            echo "::error::No encuentro app/build.gradle en la raíz ni en miscuentas_v160/"
            exit 1
          fi

      - name: Configurar Android SDK sin paquete obsoleto tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK no está preinstalado en el runner"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No encuentro sdkmanager en $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          curl --fail --location --retry 8 --retry-all-errors https://services.gradle.org/distributions/gradle-8.9-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Validar versión y JavaScript
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          grep -Eq "versionCode[[:space:]]+31" app/build.gradle
          grep -Eq "versionName[[:space:]]+['\"]1\.9\.5['\"]" app/build.gradle
          python3 - <<'PY'
          import re
          p='app/src/main/assets/index.html'
          html=open(p,encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          open('/tmp/miscuentas-1.9.5.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/miscuentas-1.9.5.js

      - name: Compilar APK 1.9.5
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Preparar APK con nombre de versión
        shell: bash
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/MisCuentas-1.9.5-v31.apk"

      - name: Publicar APK con nombre de versión
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.9.5-v31
          path: MisCuentas-1.9.5-v31.apk
          if-no-files-found: error
          
