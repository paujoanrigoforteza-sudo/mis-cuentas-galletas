
name: Build MisCuentas 1.9.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK requerido
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        run: |
          curl --fail --location --retry 8 --retry-all-errors https://services.gradle.org/distributions/gradle-8.9-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Descomprimir proyecto 1.9.1
        shell: bash
        run: |
          ZIP="MisCuentas_1.9.1.zip"
          test -s "$ZIP" || { echo "No se encuentra $ZIP en la raíz del repositorio"; exit 1; }
          mkdir -p "$RUNNER_TEMP/proyecto"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/proyecto"
          SETTINGS="$(find "$RUNNER_TEMP/proyecto" -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          test -n "$SETTINGS" || { echo "No se encontró settings.gradle"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle" || { echo "No se encontró app/build.gradle"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Comprobar versión y JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          root = pathlib.Path(os.environ['PROJECT_DIR'])
          gradle = (root / 'app/build.gradle').read_text(encoding='utf-8')
          if not re.search(r"versionName\s+['\"]1\.9\.1['\"]", gradle):
              sys.exit('versionName no es 1.9.1')
          if not re.search(r'versionCode\s+27\b', gradle):
              sys.exit('versionCode no es 27')
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              sys.exit('No se encontraron bloques JavaScript')
          pathlib.Path('/tmp/miscuentas-1.9.1.js').write_text('\n'.join(scripts), encoding='utf-8')
          java = (root / 'app/src/main/java/com/pau/miscuentas/MainActivity.java').read_text(encoding='utf-8')
          if 'SpeechRecognizer.createSpeechRecognizer(this)' not in java:
              sys.exit('No se encontró reconocimiento nativo en MainActivity')
          if 'startActivityForResult(intent, REQ_SPEECH)' in java:
              sys.exit('Se detectó el antiguo lanzador visual de Google')
          print('Versión, JavaScript y reconocimiento nativo comprobados.')
          PY
          node --check /tmp/miscuentas-1.9.1.js
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-1.9.1-v27
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
